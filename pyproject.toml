[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tracta"
version = "0.1.0"
description = "Check whether a model provider still serves the model it promised"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
tracta = "tracta.cli:main"

[tool.setuptools]
packages = ["tracta"]
