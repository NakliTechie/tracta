<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>tracta social card</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,650&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* 1280x640 card for the repo and the site. Rendered to social.png by marketing/render-card.py. */
:root { --bg: #f5f6f4; --ink: #16191b; --muted: #5b6366; --accent: #1f6f78; --changed: #c2531f; --tint: #e6efee; --rule: #d9ddd9; }
html, body { margin: 0; width: 1280px; height: 640px; background: var(--bg); color: var(--ink); }
.card { box-sizing: border-box; width: 1280px; height: 640px; padding: 72px 84px; display: grid; grid-template-columns: 1fr 360px; gap: 56px; align-items: center; }
.brand { font: 500 30px/1 "IBM Plex Mono", Menlo, monospace; letter-spacing: 0.04em; color: var(--accent); }
h1 { font: 650 64px/1.08 "Fraunces", Georgia, serif; margin: 26px 0 22px; letter-spacing: -0.01em; }
p { font: 400 27px/1.4 "IBM Plex Sans", Helvetica, Arial, sans-serif; color: var(--muted); margin: 0; max-width: 30ch; }
.foot { margin-top: 34px; font: 500 22px/1 "IBM Plex Mono", Menlo, monospace; color: var(--ink); }
.grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 8px; padding: 22px; background: #fff; border: 1px solid var(--rule); border-radius: 8px; }
.grid i { aspect-ratio: 1; border-radius: 3px; background: var(--tint); border: 1px solid var(--rule); }
.grid i.c { background: var(--changed); border-color: var(--changed); }
.legend { margin-top: 14px; font: 400 18px/1.3 "IBM Plex Sans", Helvetica, Arial, sans-serif; color: var(--muted); }
.legend b { color: var(--changed); font-weight: 500; }
</style>
</head>
<body>
<div class="card">
  <div>
    <div class="brand">tracta</div>
    <h1>Is your AI provider still serving the model you pay for?</h1>
    <p>Same short questions, different days. A change is reported only when it exceeds the provider's own noise.</p>
    <div class="foot">One binary · MIT · tracta.naklitechie.com</div>
  </div>
  <div>
    <div class="grid" id="g"></div>
    <div class="legend"><b>Orange</b>: answers that moved after a swap.</div>
  </div>
</div>
<script>
  var moved = [2, 5, 9, 12, 13, 18, 22, 27, 30, 33, 37, 41, 44, 46, 51, 54, 58, 61];
  for (var i = 0; i < 64; i++) { var c = document.createElement("i"); if (moved.indexOf(i) >= 0) c.className = "c"; document.getElementById("g").appendChild(c); }
</script>
</body>
</html>
